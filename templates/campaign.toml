# campaign.toml — the human writes this once; `lab run` reads it and refuses to
# continue a campaign whose file changed (a changed campaign is a new campaign).
# See docs/aira2-loop-design.md. Validate with `tools/lab campaign check`.

[campaign]
id   = "ns-REPLACE-ME"          # lowercase [a-z0-9-]
task = "task.md"                # the task statement workers receive verbatim
kind = "research"

[data]
train     = "data/train"                          # workers may read
evaluator = "eval/score.py"                       # `score.py <predictions> <labels>` prints {"score": x, "n": k}
baseline  = "bash eval/baseline.sh"               # the trivial solution; always candidate c0000

[data.search]                                     # drives selection; labels hidden from workers
inputs = "data/search"
labels = "$LAB_PRIVATE/ns-REPLACE-ME/search"

[data.final]                                      # read exactly once, at the end
inputs = "data/final"
labels = "$LAB_PRIVATE/ns-REPLACE-ME/final"

[eval]
# user = "labeval"               # run the evaluator as this Unix user (one sudoers line;
                                 # see docs/labeval.md). Without it labels are hidden by
                                 # convention only and REPORT.md says so.
timeout = "10m"

[resources]
gpus             = [0]           # one job per GPU; [] means CPU-only, one slot
max_parallel_jobs = 1
min_free_vram_mb = 0             # >0: skip a GPU whose free VRAM (nvidia-smi) is below this
gpu_hours_total  = 20
job_wall_clock   = "3h"          # per job, enforced by `lab watch`
stall_min        = 30            # kill a job with no output and no CPU for this long
worker_model     = "claude-sonnet-5"
worker_max_turns = 40
# [resources.worker_model_by_operator]   # per-operator override of worker_model; keys are
# draft = "claude-opus-5"                # draft | improve | crossover | debug (not baseline).
                                         # A stronger model where the approach is chosen

[worker]
# M0: any command. M1: the Claude Code wrapper. It receives LAB_CANDIDATE_DIR, LAB_JOB,
# LAB_OPERATOR, LAB_TASK, LAB_TRAIN, LAB_SPLIT_INPUTS, LAB_PREDICTIONS_OUT,
# CUDA_VISIBLE_DEVICES and must write code/run.sh + summary.md and run code/run.sh once.
command = "tools/lab-worker"

[selection]                      # AIRA₂ temperature-scaled rank selection
temperature = 0.3                # over normalised rank in [0,1]; lower = greedier
crossover_p = 0.15
draft_p = 0.0                    # chance of a fresh approach instead of a child; drawn before
                                 # crossover. 0 = drafts only while the population is empty
initial_drafts = 1               # independent first approaches after the baseline, before any
                                 # improve or crossover; each extra one costs an improve slot
max_debug_retries = 1
# seed = 12345                   # default: derived from campaign.id

[memory]                         # what a worker is told about earlier candidates
# mode = "findings-v2"           # one immutable finding.json per settled candidate and a
                                 # bounded, deterministic snapshot of cards from every branch
                                 # in each job card (docs/finding-cards-plan.md §3, §3b).
                                 # "findings-v1" is the original selection, kept frozen;
                                 # v2 never shows the trivial baseline as a cross-branch
                                 # card, orders topic matches newest-first, gives siblings
                                 # their own slots and keeps two cross-branch cards under
                                 # the byte budget. Default "legacy": the first-parent
                                 # lineage of clipped summaries.
                                 # Frozen into population.json when the campaign starts.
# knobs = "out/memory_config.json"   # findings-v2 only: a small JSON object your code
                                 # writes (relative to the candidate dir). Each card
                                 # carries its scalars, and every job card ends with a
                                 # ledger of one line per settled candidate diffing them
                                 # against its first parent's — so a knob already moved
                                 # in this direction is visible even when its card is not.

[usage]                          # the Claude Max window is the second scarce resource
# window_budget = 12.0           # list-price USD per window the plan tolerates (as `claude -p`
                                 # reports total_cost_usd). Calibrate from `lab campaign usage`
                                 # of a short run; without it the loop only reacts to
                                 # rate-limit messages and cannot pace itself.
window       = "5h"              # the rolling window
soft         = 0.70              # fraction of window_budget: dispatch nothing new
hard         = 0.90              # fraction: also kill running sessions; their jobs are deferred
session_cost = 0.50              # reservation per running session until 3 have finished
retry        = "30m"             # wait after a rate-limit message that states no reset time
max_defers   = 3                 # a job deferred more often than this is dropped, with a note

[stop]                           # any one of these ends the search
max_candidates     = 60
no_improvement_for = 12
wall_clock         = "48h"

[report]
success_threshold = 0.85         # fixed now, reported against at the end; never a blocker
higher_is_better  = true
