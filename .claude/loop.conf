# loop.conf — the single place model and driver choices live.
# Read by loop.sh (unattended) and by /orchestrate (attended). `lab validate`
# checks that every phase has a model, that orchestrator= is set, and that
# permission_mode is one of auto|bypassPermissions.

# --- models per phase ------------------------------------------------------
# Priced by measurement, not vibes: a phase session re-reads its whole context
# every turn, so a 200-turn session at ~150k context reads 20-40M cached tokens
# — and build is plumbing ("an engineer, not a scientist"), measured as the
# single biggest bucket. Sonnet does engineering; Opus goes where judgment
# density is high (pilot's measurement-soundness call, analyze's verdict
# reading); Fable ($10/$50 per MTok, 2x Opus) only where a wrong call is most
# expensive: decide. Upgrading the lab to a newer model is still a one-line
# change here.
init=claude-sonnet-5
build=claude-sonnet-5
pilot=claude-opus-5
execute=claude-opus-5
analyze=claude-opus-5
decide=claude-fable-5
conclude=claude-opus-5

# Supervision visits (execute-phase paperwork and mechanical judgment while
# trials run detached under `lab watch`) are tail-and-compare work, not research.
supervise=claude-haiku-4-5

# The attended orchestrator makes zero research decisions — it relays gates.
orchestrator=claude-sonnet-5

# --- driver knobs ----------------------------------------------------------
# auto            = classifier-approved tool calls, anything else auto-denied.
# bypassPermissions = ONLY inside an isolated container/VM without credentials,
#                     never as root. settings.json keeps deny rules either way.
permission_mode=auto

max_iterations=50        # loop.sh safety stop
max_turns=150            # --max-turns per phase session: a backstop against the
                         # quadratic context burn, not a target. Sessions should
                         # checkpoint (HANDOFF + commit, phase untouched) long
                         # before hitting it; the driver relaunches them fresh.
backoff_sec=30           # first backoff after a failed session; doubles, capped
max_failures=3           # consecutive session failures before loop.sh gives up
max_no_progress=2        # sessions that change nothing before a gate is raised
supervise_interval_sec=1800  # judgment-visit cadence while execute trials run watched
watch_poll_sec=60        # loop.sh watch-registry poll while waiting on live watches
wakeup_max_sec=3300      # 55 min — background-run check cadence (see CLAUDE.md)
push=false               # true = loop.sh pushes after each phase that moved state,
                         # which is what makes the site update live. Off by default:
                         # pushing is outward-facing, so you opt in deliberately.

